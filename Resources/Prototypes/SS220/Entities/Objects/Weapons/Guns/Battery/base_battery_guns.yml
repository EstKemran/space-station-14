- type: entity
  abstract: true
  id: BaseBlaster
  parent: BaseItem
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/SS220/Effects/Drop/laser.ogg ##new sound_drop effect, add MIXnikita
      params:
        volume: 2
  - type: Sprite
    sprite: SS220/Objects/Weapons/Guns/Battery/ert_blaster.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
    - state: mag-unshaded-5
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: AmmoCounter
  - type: Item
    size: Huge
  - type: Clothing
    sprite: SSS220/Objects/Weapons/Guns/Battery/ert_blaster.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -20
  - type: Gun
    fireRate: 6.5
    minAngle: 17
    maxAngle: 29
    angleIncrease: 3
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/SS220/Weapons/Guns/Gunshots/blaster_nt.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PowerCellBlaster
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 1
        whitelist:
          tags:
            - PowerCellBlaster
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      gun_magazine: !type:ContainerSlot
  - type: MagazineAmmoProvider
    proto: BulletBlasterAlt
    fireCost: 40
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: Appearance
  - type: StaticPrice
    price: 500