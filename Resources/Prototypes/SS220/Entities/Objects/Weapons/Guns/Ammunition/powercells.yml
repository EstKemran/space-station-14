#Base
- type: entity
  parent: BaseItem
  id: PowerCellBlaster
  components:
  - type: Item
  - type: Battery
    pricePerJoule: 0.15
    maxCharge: 800
    startingCharge: 800
  - type: PowerCell
  - type: Sprite
    sprite: SS220/Objects/Weapons/Guns/Ammunition/Magazine/blaster_powercells.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: base
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Tag
    tags:
      - PowerCellBlaster
  - type: Appearance
  - type: PowerCellVisuals
  - type: Riggable
  - type: AmmoCounter
  - type: ProjectileBatteryAmmoProvider
    proto: BulletBlasterAlt
    fireCost: 40

- type: entity
  parent: PowerCellBlaster
  id: BlasterPowerCellPrinted
  suffix: Empty
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: base
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
      visible: false
  - type: Battery
    maxCharge: 800
    startingCharge: 0

- type: entity
  parent: PowerCellBlaster
  id: BlasterPowerCellHighCapacity
  name: high-capacity blaster power cell
  description: It contains a lot more pain than you ever dreamed of.
  components:
  - type: Battery
    pricePerJoule: 0.15
    maxCharge: 1200
    startingCharge: 1200
