- type: htnCompound
  id: DragonBroodCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: DragonBroodDestroyTarget
    - !type:HTNCompoundTask
      task: DragonBroodDestroyCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: DragonBroodGuardThreats
    - !type:HTNCompoundTask
      task: DragonBroodGuardThreatCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: DragonBroodAggressors
    - !type:HTNCompoundTask
      task: DragonBroodAggressorCompound
  - tasks:
    - !type:HTNCompoundTask
      task: FollowCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime

- type: htnCompound
  id: DragonBroodDestroyCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: InteractRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
        targetState: Dead
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: InteractRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: DragonBroodDestroyTarget
        key: Target

- type: htnCompound
  id: DragonBroodGuardThreatCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: DragonBroodGuardThreats
        key: Target

- type: htnCompound
  id: DragonBroodAggressorCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
      services:
      - !type:UtilityService
        id: MeleeService
        proto: DragonBroodAggressors
        key: Target

- type: utilityQuery
  id: DragonBroodDestroyTarget
  query:
  - !type:BlackboardTargetQuery
    key: DestroyTarget
  considerations:
  - !type:TargetIsDeadCon
    curve: !type:InverseBoolCurve
  - !type:TargetIsVisibleCon
    curve: !type:BoolCurve
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

- type: utilityQuery
  id: DragonBroodGuardThreats
  query:
  - !type:GuardedHostilesQuery
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetIsVisibleCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
  - !type:TargetInLOSOrCurrentCon
    curve: !type:BoolCurve

- type: utilityQuery
  id: DragonBroodAggressors
  query:
  - !type:BlackboardTargetQuery
    key: GuardAggressor
    leashRangeKey: GuardAggressorRange
  - !type:BlackboardTargetQuery
    key: SelfAggressor
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve
  - !type:TargetIsVisibleCon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve
